<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2038">
<title>Jusqu’à novembre</title>
<meta property="og:title" content="Jusqu’à novembre">
<meta property="og:description" content="Le compte à rebours des retrouvailles 🦝✨">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Fredoka,system-ui,sans-serif; color:#f4ecff;
    background:linear-gradient(180deg,#161c33 0%,#232b4d 60%,#33305e 100%);
    background-attachment:fixed; min-height:100vh; overflow-x:hidden;
  }
  #ciel{position:fixed; inset:0; z-index:0; pointer-events:none}
  .star{position:absolute; background:#fff; border-radius:50%; animation:tw 3s ease-in-out infinite alternate}
  .flot{position:absolute; bottom:-8vh; animation:rise linear infinite}
  @keyframes tw{from{opacity:.15}to{opacity:.85}}
  @keyframes rise{to{transform:translateY(-120vh) rotate(20deg)}}

  main{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:clamp(30px,8vw,72px) 22px 40px; text-align:center}
  .lead{font-size:15px; letter-spacing:.2em; text-transform:uppercase; color:rgba(244,236,255,.55); margin:0}
  .lead b{color:#ff9fb8}
  .big{
    font-weight:700; font-size:clamp(96px,25vw,170px); line-height:1.05; margin:6px 0 0;
    color:#ffd6e4; cursor:pointer; user-select:none; -webkit-user-select:none;
    text-shadow:0 6px 30px rgba(255,140,180,.35); transition:transform .15s;
  }
  .big:active{transform:scale(.95)}
  .dodos{font-size:clamp(17px,4.5vw,22px); font-weight:500; margin:0; color:#ffe9b8}
  .clock{font-size:14px; color:rgba(244,236,255,.5); margin:8px 0 0; font-variant-numeric:tabular-nums}

  .constel{margin:52px auto 0; max-width:460px}
  .constel svg{width:100%; height:auto; overflow:visible}
  .constel circle{filter:drop-shadow(0 0 3px rgba(255,210,230,.9)); animation:tw 2.8s ease-in-out infinite alternate}
  .constel circle:nth-of-type(2n){animation-delay:-1.3s}
  .constel circle:nth-of-type(3n){animation-delay:-2.1s}
  .cap{font-size:14px; color:rgba(244,236,255,.6); margin-top:2px}

  .liste{margin:52px auto 0; text-align:left}
  h2{font-size:24px; font-weight:600; text-align:center; margin:0 0 2px; color:#ffd6e4}
  .score{text-align:center; font-size:13px; color:rgba(244,236,255,.5); margin:0 0 16px}
  ul{list-style:none; margin:0; padding:0; columns:2; column-gap:30px}
  @media(max-width:560px){ul{columns:1}}
  li{break-inside:avoid}
  li label{display:flex; gap:9px; align-items:flex-start; padding:5px 6px; border-radius:10px; cursor:pointer}
  li label:hover{background:rgba(255,255,255,.06)}
  li input{position:absolute; opacity:0; pointer-events:none}
  .h{flex:0 0 auto; width:20px; text-align:center; transition:transform .25s}
  .h::before{content:"♡"; color:#ff9fb8}
  li.done .h::before{content:"❤"}
  li.done .h{transform:scale(1.2)}
  li.done .t{color:rgba(244,236,255,.4); text-decoration:line-through; text-decoration-color:rgba(255,159,184,.5)}
  .t{font-size:15px; line-height:1.45}
  a{color:#ffb1c8}

  footer{margin:46px 0 8px; font-size:13px; color:rgba(244,236,255,.45)}
  .pop{position:fixed; z-index:9; pointer-events:none; animation:pop 1.1s ease-out forwards}
  @keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}
  @media(prefers-reduced-motion:reduce){.star,.flot,.constel circle{animation:none}.flot{display:none}}
</style>
</head>
<body>
<div id="ciel" aria-hidden="true"></div>
<main>
  <p class="lead">toi <b>❤</b> moi</p>
  <div class="big" id="big" title="clique ✨">J-…</div>
  <p class="dodos" id="dodos">&nbsp;</p>
  <p class="clock" id="clock">retrouvailles le 1ᵉʳ novembre 2026</p>

  <section class="constel">
    <svg viewBox="70 10 300 140" role="img" aria-label="La constellation du raton laveur">
      <g stroke="rgba(255,214,231,.32)" stroke-width="1" fill="none" stroke-linecap="round">
        <polyline points="100,58 115,30 132,54"/>
        <polyline points="170,54 187,28 202,58"/>
        <polyline points="88,92 100,58"/>
        <polyline points="132,54 151,62 170,54"/>
        <polyline points="202,58 214,94"/>
        <polyline points="88,92 108,122 151,134 194,122 214,94"/>
        <polyline points="128,90 151,108 176,90"/>
        <polyline points="214,94 252,118 296,138"/>
        <polyline points="296,138 332,126 350,98 342,70"/>
      </g>
      <g fill="#ffe9f3">
        <circle cx="100" cy="58" r="2.2"/><circle cx="115" cy="30" r="2.6"/><circle cx="132" cy="54" r="2.2"/>
        <circle cx="151" cy="62" r="2.2"/><circle cx="170" cy="54" r="2.2"/><circle cx="187" cy="28" r="2.6"/>
        <circle cx="202" cy="58" r="2.2"/><circle cx="88" cy="92" r="2.4"/><circle cx="214" cy="94" r="2.4"/>
        <circle cx="108" cy="122" r="2.2"/><circle cx="151" cy="134" r="2.4"/><circle cx="194" cy="122" r="2.2"/>
        <circle cx="128" cy="90" r="3.8" fill="#fff"/><circle cx="176" cy="90" r="3.8" fill="#fff"/>
        <circle cx="151" cy="108" r="3"/><circle cx="252" cy="118" r="2.2"/><circle cx="296" cy="138" r="2.4"/>
        <circle cx="332" cy="126" r="3"/><circle cx="350" cy="98" r="3"/><circle cx="342" cy="70" r="3"/>
      </g>
    </svg>
    <p class="cap">la constellation du raton laveur 🔭</p>
  </section>

  <section class="liste">
    <h2>la liste</h2>
    <p class="score" id="score">&nbsp;</p>
    <ul id="bucket"></ul>
  </section>

  <footer>fait avec ❤ et un peu de pâte à cookie 🍪</footer>
</main>

<script>
  const TARGET = new Date(2026, 10, 1);  // 1er novembre 2026

  const $ = id => document.getElementById(id);
  const DAY = 864e5;

  function tick(){
    const diff = TARGET - Date.now();
    if (diff <= 0){
      $("big").textContent = "🤗";
      $("dodos").textContent = "c’est aujourd’hui !";
      document.title = "Ensemble ❤";
      return;
    }
    const days = Math.ceil(diff / DAY);
    const h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
    $("big").textContent = "J-" + days;
    $("dodos").textContent = days === 1 ? "dernier dodo 🤍" : `encore ${days} dodos 😴`;
    $("clock").textContent = `1ᵉʳ novembre 2026 · ${h} h ${String(m).padStart(2,"0")} min ${String(s).padStart(2,"0")} s`;
    document.title = `J-${days} · Jusqu’à novembre`;
  }
  tick(); setInterval(tick, 1000);

  const ITEMS = [
    ["🤗","FAIRE DES CÂLINS"],
    ["🪩","retourner au Fluid pour une soirée insolite"],
    ["⛵","retourner à Sausalito, aka petite sauce"],
    ["🎬","voir Split"],
    ["♟️","voir The Queen’s Gambit"],
    ["👑","voir The Adventures of Priscilla, Queen of the Desert"],
    ["🌋","aller à Yellowstone"],
    ["♨️","aller au parc volcanique (bypass hell)"],
    ["🦞","aller à Boston"],
    ["🐦‍⬛","aller à Baltimore pour le musée Edgar Allan Poe"],
    ["🚂","prendre l’Amtrak pour Sacramento"],
    ["💍","se marier (où ?)"],
    ["🏊","aller se baigner"],
    ["🐻","voir un ours et lui faire un câlin =))"],
    ["👾","aller au musée du jeu vidéo"],
    ["🖼️","aller au musée de SF"],
    ["🏛️","aller au musée de la Légion d’Honneur"],
    ["🧑‍🔬","travailler ensemble"],
    ["🏡","avoir un appartement"],
    ["🏎️","conduire une Mustang GT noire (2.3L High Performance)"],
    ["🌴","aller à LA"],
    ["🌊","aller à Malibu"],
    ["🪜","aller à la « plage des escaliers »"],
    ["🎢","aller au parc Disney de LA"],
    ["🏀","aller voir un match des Lakers"],
    ["🎰","jouer dans un casino à Las Vegas"],
    ["🥪","aller à Hawaii pour les sandwiches gratuits"],
    ["🗽","revisiter NYC"],
    ["🥢","le restaurant chinois Mujiri près de chez Martina"],
    ["🍪","acheter des cookies chez Insomnia Cookies"],
    ["🇫🇷","aller en France (Paris, Montpellier, Lozère)"],
    ["🇧🇪","aller en Belgique"],
    ["🇧🇷","aller au Brésil"],
    ["🎸","voir les Psychedelic Furs en Californie"],
    ["🥐","acheter des croissants et des pains au chocolat"],
    ["📸","prendre une jolie photo ensemble"],
    ["🐶","avoir un animal de compagnie (un chien =’))"],
    ["🎳","jouer au bowling"],
    ["🫘","FALL GUYS !"],
    ["🎮","jouer aux jeux vidéo (Mario Kart etc.)"],
    ["🐠","avoir un aquarium"],
    ["🐦","apprivoiser un oiseau sauvage"],
    ["🕹️","faire des jeux d’arcade"],
    ["🌙","avoir un hamac"],
    ["🏚️","faire de l’urbex"],
    ["🌸","acheter un parfum"],
    ["🤿","faire du tuba"],
    ["😴","avoir une routine de sommeil régulière"],
    ["📚","avoir une bibliothèque française"],
    ["🚚","vivre dans un autre état des USA, ou à l’étranger"],
    ["🍄","aller cueillir des champignons"],
    ["🌷","voir <a href='https://www.instagram.com/p/Db5-BPHguDA/' target='_blank' rel='noopener'>le lac rose</a>"],
  ];
  const KEY = "jn-liste-v1";
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){}

  const ul = $("bucket");
  const score = () => $("score").textContent = `${done.size} / ${ITEMS.length} ❤`;
  ITEMS.forEach((it, i) => {
    const li = document.createElement("li");
    if (done.has(i)) li.className = "done";
    li.innerHTML = `<label><input type="checkbox" data-i="${i}" ${done.has(i) ? "checked" : ""}><span class="h" aria-hidden="true"></span><span class="t">${it[0]} ${it[1]}</span></label>`;
    ul.appendChild(li);
  });
  score();
  ul.addEventListener("change", e => {
    const i = +e.target.dataset.i;
    e.target.checked ? done.add(i) : done.delete(i);
    e.target.closest("li").classList.toggle("done", e.target.checked);
    score();
    try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(err){}
  });

  // ciel : étoiles + douceurs flottantes
  const ciel = $("ciel");
  for (let i = 0; i < 80; i++){
    const s = document.createElement("div");
    s.className = "star";
    const size = 1 + Math.random() * 1.5;
    s.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${-Math.random()*3}s;animation-duration:${2.4+Math.random()*2.4}s`;
    ciel.appendChild(s);
  }
  const EMOJIS = ["❤️","🥐","🍪","🐿️","🤍","🦝","✨"];
  for (let i = 0; i < 18; i++){
    const f = document.createElement("span");
    f.className = "flot";
    f.textContent = EMOJIS[i % EMOJIS.length];
    f.style.cssText = `left:${Math.random()*100}vw;font-size:${14+Math.random()*16}px;opacity:${(.25+Math.random()*.3).toFixed(2)};animation-duration:${18+Math.random()*20}s;animation-delay:${-Math.random()*38}s`;
    ciel.appendChild(f);
  }

  // pluie de cœurs au clic
  $("big").addEventListener("click", e => {
    const x = e.clientX || innerWidth/2, y = e.clientY || innerHeight/3;
    const B = ["❤","🥐","🍪","✨"];
    for (let i = 0; i < 12; i++){
      const p = document.createElement("span");
      p.className = "pop";
      p.textContent = B[i % B.length];
      p.style.cssText = `left:${x}px;top:${y}px;font-size:${12+Math.random()*14}px;--dx:${(Math.random()*220-110)|0}px;--dy:${(-40-Math.random()*150)|0}px;--rot:${(Math.random()*80-40)|0}deg`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  });
</script>
</body>
</html>
